<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="600" height="750" role="img" aria-label="BEFORE illustration">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#e6dfe1"/>
      <stop offset="100%" stop-color="#ded5d2"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="3.5"/></filter>
  </defs>

  <rect width="600" height="750" fill="url(#bg)"/>

  <!-- Head-and-shoulders silhouette: enough to read as a portrait plate
       without pretending to be a person. -->
  <g fill="#9a4a63" fill-opacity="0.22">
    <circle cx="300" cy="300" r="132"/>
    <path d="M300 440 c -118 0 -196 74 -206 190 h 412 c -10 -116 -88 -190 -206 -190 z"/>
  </g>

  <rect width="600" height="750" fill="url(#glow)"/>

  <!-- Texture marks: dense and scattered on the before plate, almost gone on
       the after plate. -->
  <g fill="#9a4a63" fill-opacity="0.30" filter="url(#soft)">
    <ellipse cx="232" cy="250" rx="13" ry="11"/>
    <ellipse cx="352" cy="236" rx="9" ry="7"/>
    <ellipse cx="289" cy="322" rx="15" ry="13"/>
    <ellipse cx="247" cy="372" rx="8" ry="6"/>
    <ellipse cx="356" cy="352" rx="12" ry="10"/>
    <ellipse cx="312" cy="268" rx="7" ry="5"/>
    <ellipse cx="268" cy="300" rx="10" ry="8"/>
    <ellipse cx="338" cy="400" rx="9" ry="7"/>
    <ellipse cx="222" cy="320" rx="6" ry="4"/>
    <ellipse cx="372" cy="300" rx="8" ry="6"/>
    <ellipse cx="300" cy="214" rx="6" ry="4"/>
    <ellipse cx="262" cy="420" rx="11" ry="9"/>
    <ellipse cx="348" cy="452" rx="7" ry="5"/>
    <ellipse cx="240" cy="208" rx="5" ry="4"/>
    <ellipse cx="330" cy="200" rx="6" ry="4"/>
  </g>

  <g font-family="'Jost', system-ui, sans-serif" fill="#9a4a63">
    <text x="40" y="60" font-size="18" letter-spacing="6" fill-opacity="0.75">BEFORE</text>
    <text x="40" y="716" font-size="12" letter-spacing="3" fill-opacity="0.45">SAMPLE ILLUSTRATION</text>
  </g>
</svg>
