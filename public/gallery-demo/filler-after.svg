<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="600" height="750" role="img" aria-label="AFTER illustration">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#faf2f3"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <rect width="600" height="750" fill="url(#bg)"/>

  <!-- Head-and-shoulders silhouette: enough to read as a portrait plate
       without pretending to be a person. -->
  <g fill="#9a4a63" fill-opacity="0.15">
    <circle cx="300" cy="300" r="132"/>
    <path d="M300 440 c -118 0 -196 74 -206 190 h 412 c -10 -116 -88 -190 -206 -190 z"/>
  </g>

  <rect width="600" height="750" fill="url(#glow)"/>

  <!-- Texture marks: dense and scattered on the before plate, almost gone on
       the after plate. -->
  <g fill="#9a4a63" fill-opacity="0.07" filter="url(#soft)">
    <ellipse cx="232" cy="250" rx="13" ry="11"/>
    <ellipse cx="352" cy="236" rx="9" ry="7"/>
    <ellipse cx="289" cy="322" rx="15" ry="13"/>
  </g>

  <g font-family="'Jost', system-ui, sans-serif" fill="#9a4a63">
    <text x="40" y="60" font-size="18" letter-spacing="6" fill-opacity="0.75">AFTER</text>
    <text x="40" y="716" font-size="12" letter-spacing="3" fill-opacity="0.45">SAMPLE ILLUSTRATION</text>
  </g>
</svg>
